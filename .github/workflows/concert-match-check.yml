name: Weekly concert match check

# Added 2026-08-15, following the same precedent established for
# vinyl-scout's scripts/scheduled-sweep.mjs / scheduled-sweep.yml
# (2026-08-14). Runs entirely inside Actions -- no Netlify compute, no
# Blobs client, no credential of any kind beyond the built-in
# GITHUB_TOKEN (used only for git commit/push). Both endpoints this
# script calls (this site's own /api/watched-trips and Vinyl Scout's
# /api/artists-playing) are already-public reads.
#
# Sole sweep as of 2026-08-30. Ran additively alongside the old
# Netlify-scheduled concert-match-check.mjs from 2026-08-15, with
# netlify/functions/watched-trips.mjs reading this file's committed
# output since 2026-08-15 (v2) -- see that file's header. The old
# Netlify-scheduled function was retired 2026-08-26 (PR #6) once this
# path had run clean on schedule twice (2026-08-17, 2026-08-24) with no
# gap; watched-trips.mjs's v3 update the same week dropped the Blobs
# fallback that named it. This is now the only writer for
# data/concert-match-log.json.
#
# Scheduled Mondays 18:05 UTC (moved from 12:05 UTC on 2026-10-26, so no
# run starts before 10 am Pacific all year: 18:05 UTC is 10:05 PST and
# 11:05 PDT). The 5-minute offset from the old function's Monday firing no
# longer matters now that it's retired.

on:
  schedule:
    - cron: "5 18 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write # only used by the issue-on-failure step below

jobs:
  concert-match-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check watched trips for new concert matches
        id: check
        run: node scripts/concert-match-check.mjs

      - name: Commit log if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.check.outputs.log_path }}"
          if git diff --cached --quiet; then
            echo "No changes to commit (match log matches last run)."
          else
            git commit -m "concert-match-check: ${{ steps.check.outputs.log_path }} (${{ steps.check.outputs.checked_count }} of ${{ steps.check.outputs.trip_count }} trips, via GitHub Actions)"
            git push
          fi

      # 2026-08-28: this job had no alerting of its own -- a failed run
      # (or, per GitHub's default, a scheduled workflow that gets
      # auto-disabled after 60 days with no repo activity, though that
      # doesn't apply here since this repo sees regular pushes) just sat
      # quiet in the Actions tab, nobody would notice unless they went
      # looking. Same issue-on-failure pattern as test.yml's scheduled
      # site-health checks: default GITHUB_TOKEN only, checks for an
      # already-open issue with the same title first so a run of
      # consecutive failures comments on one issue instead of opening a
      # new one each week.
      - name: Open or update tracking issue if this run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Weekly concert match check failed"
          BODY="scripts/concert-match-check.mjs (or the commit/push step after it) failed on the scheduled Monday run.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title == "'"$TITLE"'")] | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
