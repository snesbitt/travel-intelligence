name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily (was weekly until 2026-08-28): catches content drift (About page
    # stat tiles vs. app.js's DIMENSIONS/PRIORITY_WEIGHTS, see
    # scripts/check-content-drift.mjs) even on a day with no code changes at
    # all. Runs the same job as a normal push, so no separate workflow file
    # or new failure mode. Moved to daily specifically so the live-site
    # checks below (deploy freshness, added 2026-08-28) run at a cadence
    # that actually matches what they're for -- catching a stale/broken
    # deploy within a day, not within a week.
    - cron: "0 13 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # only used by the scheduled-run issue-on-failure step below
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Everything below this line runs ONLY on the daily schedule, not on
      # every push/PR: these hit the LIVE site over the network (a push's
      # deploy freshness can legitimately still be building for a few
      # minutes right after the push lands), and opening a tracking issue
      # on every PR run would be noise, not signal.

      - name: Check deploy freshness
        id: deploy_fresh
        if: github.event_name == 'schedule'
        run: npm run check:deploy
        continue-on-error: true

      - name: Check watched-trips integrity
        id: integrity
        if: github.event_name == 'schedule'
        # Independent, read-only check of the fare-watcher's live state
        # (record count, health-check recency) -- separate from
        # watch-check.mjs itself, which both WRITES that state and, until
        # now, was the only thing implicitly "checking" it. See
        # scripts/check-integrity.mjs's header for exactly what it can
        # and can't verify without a Blobs credential this repo doesn't
        # have.
        run: node scripts/check-integrity.mjs
        continue-on-error: true

      - name: Smoke test live functions
        id: smoke
        if: github.event_name == 'schedule'
        # Pings each function's safe, side-effect-free path (a health
        # ping or a plain read). check-deploy-fresh.mjs above only
        # confirms the STATIC pages are the right bytes; this confirms
        # the FUNCTIONS behind them are actually responding, the same
        # "a working page can front a 502'd backend" class of bug
        # netlify.toml's included_files fix (2026-08-28) addressed for
        # watched-trips.mjs specifically. Skips watch-check.mjs and
        # concert-match-check.mjs on purpose: schedule-only, no safe
        # read-only path to ping without triggering a real search/write.
        run: node scripts/smoke.mjs
        continue-on-error: true

      - name: Open or update tracking issue if a scheduled site check failed
        if: >-
          github.event_name == 'schedule' &&
          (steps.deploy_fresh.outcome == 'failure' || steps.integrity.outcome == 'failure' || steps.smoke.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Scheduled site-health check failed"
          BODY="- Deploy freshness: ${{ steps.deploy_fresh.outcome }}
          - Watched-trips integrity: ${{ steps.integrity.outcome }}
          - Function smoke test: ${{ steps.smoke.outcome }}

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title \
            --jq '[.[] | select(.title == "'"$TITLE"'")] | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

      - name: Fail the job if a scheduled site check failed
        if: >-
          github.event_name == 'schedule' &&
          (steps.deploy_fresh.outcome == 'failure' || steps.integrity.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: exit 1
