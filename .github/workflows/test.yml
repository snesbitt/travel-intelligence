name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of any push: catches content drift (About page
    # stat tiles vs. app.js's DIMENSIONS/PRIORITY_WEIGHTS, see
    # scripts/check-content-drift.mjs) even on a week with no code changes
    # at all. Runs the same job as a normal push, so no separate workflow
    # file or new failure mode.
    - cron: "0 13 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
