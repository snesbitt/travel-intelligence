[build]
  ignore = "bash scripts/netlify-ignore.sh"
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "https://travel-intelligence-susan.netlify.app/*"
  to = "https://travelintelligence.org/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# 2026-07-25: was max-age=600 — a 10-minute stale window after every deploy,
# which served a pre-fix app.js and made a just-shipped fix look broken.
# no-cache + Netlify's ETags = always-fresh with cheap 304 revalidation.
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
