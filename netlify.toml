[build]
  ignore = "bash scripts/netlify-ignore.sh"
  publish = "."
  functions = "netlify/functions"

# 2026-08-28: watched-trips.mjs reads data/concert-match-log.json via a
# dynamic fs.readFile() one level outside its own function directory --
# invisible to Netlify's bundler (the same failure class this repo's
# CLAUDE.md already documents as "Incident #2": works in local tests,
# 502s live because the file never made it into the deploy bundle).
# included_files makes the bundler ship it explicitly. Falls back to the
# Blobs store if this ever goes missing (see readBlobsMatchLog in that
# file), but the committed JSON should always be present after a normal
# deploy now.
[functions."watched-trips"]
  included_files = ["data/concert-match-log.json"]

[[redirects]]
  from = "https://travel-intelligence-susan.netlify.app/*"
  to = "https://travelintelligence.org/:splat"
  status = 301
  force = true

# 2026-10-30: publish = "." serves the whole repo root, so internal docs, tests,
# scripts, function source and data/concert-match-log.json (which holds watched
# route keys with origin, cabin and dates) were publicly reachable. One rule per
# file because Netlify allows a splat only at the end of a path. force = true is
# needed: a redirect never fires for a path that already resolves to a real file.
# Nothing in the front end, sw.js or the functions fetches these paths over HTTP
# (watched-trips.mjs reads data/ from disk via included_files above).
[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/CHANGELOG_ARCHIVE.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.nvmrc"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/_to_delete/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/_to_delete_locks/*"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# 2026-07-25: was max-age=600 — a 10-minute stale window after every deploy,
# which served a pre-fix app.js and made a just-shipped fix look broken.
# no-cache + Netlify's ETags = always-fresh with cheap 304 revalidation.
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# 2026-07-26: self-hosted fonts are content-stable — cache them for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
